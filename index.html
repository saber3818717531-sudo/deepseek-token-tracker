<div id="deepseek-token-tracker-settings" class="inline-drawer">
    <div class="inline-drawer-header">
        <div class="inline-drawer-icon fa-solid fa-coins"></div>
        <span><strong>🪙 DeepSeek Token 消费追踪</strong></span>
        <div class="inline-drawer-toggle fa-solid fa-circle-chevron-down"></div>
    </div>
    <div class="inline-drawer-content">

        <!-- 开关：每个独立成行，避免被挤成一排 -->
        <label class="checkbox_label" for="ds_tracker_enabled">
            <input type="checkbox" id="ds_tracker_enabled" />
            <span>启用插件</span>
        </label>
        <label class="checkbox_label" for="ds_tracker_show_chat">
            <input type="checkbox" id="ds_tracker_show_chat" />
            <span>在消息下方显示统计</span>
        </label>
        <label class="checkbox_label" for="ds_tracker_show_notif">
            <input type="checkbox" id="ds_tracker_show_notif" />
            <span>弹窗通知 (toastr)</span>
        </label>
        <label class="checkbox_label" for="ds_tracker_show_console">
            <input type="checkbox" id="ds_tracker_show_console" />
            <span>浏览器控制台输出</span>
        </label>

        <!-- API 地址：标准文本框，独占一行 -->
        <div class="range-block-title m-t-1">
            <small>API 地址匹配（URL 包含此字符串时触发）</small>
        </div>
        <input type="text" id="ds_tracker_api_url"
               class="text_pole wide100p"
               placeholder="https://api.deepseek.com" />

        <!-- 累计统计：纯展示，不用任何 input，绝不会触发范围校验 -->
        <div class="range-block-title m-t-1"><strong>📈 累计统计</strong></div>
        <div class="ds-stats-table">
            <div class="ds-stat-row"><span>累计消费</span><b id="ds_stat_total_cost">¥0</b></div>
            <div class="ds-stat-row"><span>请求次数</span><b id="ds_stat_requests">0</b></div>
            <div class="ds-stat-row"><span>总输入 tokens</span><b id="ds_stat_input">0</b></div>
            <div class="ds-stat-row"><span>总输出 tokens</span><b id="ds_stat_output">0</b></div>
            <div class="ds-stat-row"><span>缓存命中</span><b id="ds_stat_cache_hit" class="ds-green">0</b></div>
            <div class="ds-stat-row"><span>缓存未命中</span><b id="ds_stat_cache_miss" class="ds-red">0</b></div>
        </div>

        <div id="ds_tracker_reset_btn" class="menu_button menu_button_icon fa-solid fa-trash m-t-1" style="text-align:center;">
            重置累计统计
        </div>

        <!-- 计费说明 -->
        <div class="ds-help-text">
            计费标准：<br/>
            · 输入（缓存命中）：¥0.02 / 百万 tokens<br/>
            · 输入（缓存未命中）：¥1.00 / 百万 tokens<br/>
            · 输出：¥2.00 / 百万 tokens<br/><br/>
            斜杠命令：<code>/token</code> 查看最近统计 · <code>/tokenreset</code> 重置
        </div>
    </div>
</div>
